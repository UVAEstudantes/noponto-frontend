name: 📱 NoPonto Mobile — Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: mobile-build
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./NoPonto

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Setup Expo e EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK Android
        run: eas build --platform android --profile preview --non-interactive --clear-cache

      - name: Resumo
        run: |
          echo "## 📱 NoPonto Mobile Build" >> $GITHUB_STEP_SUMMARY
          echo "**Perfil:** preview (APK)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY