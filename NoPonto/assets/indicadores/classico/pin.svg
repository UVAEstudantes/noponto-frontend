<svg xmlns="http://www.w3.org/2000/svg" width="64" height="72" viewBox="0 0 64 72" fill="none" color="#FFC400">
  <!--
    Marcador universal. Frente na ponta inferior.
    Cor da carroceria: atributo color na raiz (fill usa currentColor).
    Area sugerida para o icone sobreposto: x=18, y=16, largura=28, altura=28.
    Centro do icone: (32, 30). Nenhum icone esta embutido neste SVG.
  -->
  <defs>
    <path id="classico-pin-shape" d="M32 5C17 5 5 15 5 30C5 42 13 49 23 57L29 65C30.5 67 31.2 68 32 68C32.8 68 33.5 67 35 65L41 57C51 49 59 42 59 30C59 15 47 5 32 5Z"/>
    <linearGradient id="classico-pin-volume" x1="18" y1="8" x2="46" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".32"/>
      <stop offset=".4" stop-color="#FFF" stop-opacity=".06"/>
      <stop offset=".65" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="classico-pin-edge" x1="24" y1="5" x2="40" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#000" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <g id="carroceria" fill="currentColor">
    <use href="#classico-pin-shape"/>
  </g>
  <g id="volume">
    <use href="#classico-pin-shape" fill="url(#classico-pin-volume)"/>
    <use href="#classico-pin-shape" stroke="url(#classico-pin-edge)" stroke-width=".8"/>
  </g>
</svg>
